name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag or version (e.g. v2.1.0); leave empty for dev dry-run'
        required: false
        type: string
      publish:
        description: 'Publish/update GitHub Release when dispatching manually with a v* tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_VALUE: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            RAW_TAG="${INPUT_TAG}"
            if [ "${REF_VALUE}" != "refs/tags/${INPUT_TAG}" ]; then
              if git fetch --depth=1 origin "refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}" 2>/dev/null; then
                git checkout --detach "refs/tags/${INPUT_TAG}"
              fi
            fi
          elif [[ "${REF_VALUE}" == refs/tags/* ]]; then
            RAW_TAG="${REF_NAME}"
          else
            RAW_TAG=""
          fi

          if [ -n "${RAW_TAG}" ]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="dev"
          fi

          if [ -z "${VERSION}" ] || [[ ! "${VERSION}" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::Invalid version '${VERSION}'"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Build universal macOS app and Linux server binaries
        run: |
          env -u TEMPROOM_DEFAULT_RELAY -u TEMPROOM_SERVER_URL VERSION="$VERSION" ./scripts/build.sh

      - name: Verify build outputs and generate SHA256SUMS.txt
        run: |
          for artifact in \
            OneExit-mac.zip \
            bin/temproom-server-linux-amd64 \
            bin/temproom-server-linux-arm64; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing or empty artifact: $artifact"
              exit 1
            fi
          done
          shasum -a 256 OneExit-mac.zip bin/temproom-server-linux-amd64 bin/temproom-server-linux-arm64 | sed 's|bin/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oneexit-release-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            OneExit-mac.zip
            bin/temproom-server-linux-amd64
            bin/temproom-server-linux-arm64
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.tag, 'v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            OneExit-mac.zip
            bin/temproom-server-linux-amd64
            bin/temproom-server-linux-arm64
            SHA256SUMS.txt
